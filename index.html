<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NISA AI — AI Workspace untuk Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%);
    padding:20px;color:#fff;
  }
  .card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border-radius:24px;padding:48px 36px;max-width:520px;width:100%;
    text-align:center;box-shadow:0 25px 60px -15px rgba(0,0,0,0.5);
  }
  .logo{
    font-size:2.2rem;font-weight:700;letter-spacing:-0.5px;
    background:linear-gradient(90deg,#60a5fa,#a78bfa);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:8px;
  }
  .tagline{color:#94a3b8;font-size:1rem;margin-bottom:28px}
  .desc{color:#cbd5e1;line-height:1.7;margin-bottom:32px;font-size:0.95rem}
  .btn{
    display:inline-block;padding:16px 32px;border-radius:12px;
    background:linear-gradient(90deg,#2563eb,#7c3aed);
    color:#fff;text-decoration:none;font-weight:600;font-size:1rem;
    transition:transform .2s,box-shadow .2s;
    box-shadow:0 8px 24px -6px rgba(37,99,235,0.6);
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px -6px rgba(124,58,237,0.7)}
  .url{display:block;margin-top:18px;color:#64748b;font-size:0.85rem;word-break:break-all}
  .footer{margin-top:36px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.08);color:#64748b;font-size:0.8rem}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">NISA AI</div>
    <p class="tagline">Terminal-native, developer-first</p>
    <p class="desc">
      AI workspace untuk coding, debugging, analisis project,
      dan automation — semua dalam satu tempat.
      Kunjungi situs resmi untuk mulai menggunakan.
    </p>
    <a class="btn" href="https://nisa-ai.my.id/" target="_blank" rel="noopener">
      Kunjungi nisa-ai.my.id →
    </a>
    <span class="url">https://nisa-ai.my.id/</span>
    <div class="footer">© 2026 NISA AI · Halaman promosi</div>
  </div>
</body>
</html>
